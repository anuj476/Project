<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Clone</title>

    <style>

        body{
            margin: 0;
            font-family: Arial;
            background-color: #f1f3f6;
        }

        /* Navbar */

        .navbar{
            background-color: #2874f0;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-size: 25px;
            font-weight: bold;
        }

        input{
            width: 300px;
            padding: 8px;
            border: none;
            border-radius: 5px;
        }

        button{
            padding: 8px 15px;
            border: none;
            background-color: white;
            color: #2874f0;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Product Card */

        .container{
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .card{
            background-color: white;
            width: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .card img{
            width: 150px;
        }

        .price{
            color: green;
            font-size: 20px;
        }

    </style>

</head>
<body>

    <!-- Navbar -->

    <div class="navbar">

        <div class="logo">Flipkart</div>

        <input type="text" placeholder="Search for products">

        <button>Login</button>

    </div>

    <!-- Product -->

    <div class="container">

        <div class="card">

            <img src="https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/1/b/0/-original-imah4sssdfdjngch.jpeg">

            <h2>iPhone 15</h2>

            <p class="price">₹69,999</p>

            <button>Add to Cart</button>

        </div>

    </div>

</body>
</html>
