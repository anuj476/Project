<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#d9f4f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.menu-card{
    width:850px;
    background:#111;
    color:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.top-section{
    height:280px;
    background:url("https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=1200") center/cover;
    position:relative;
}

.top-section::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.4);
}

.title{
    position:absolute;
    left:30px;
    bottom:30px;
    z-index:1;
}

.title h1{
    font-size:55px;
    font-weight:300;
}

.title h2{
    font-size:60px;
    color:#7ce7ff;
    letter-spacing:2px;
}

.menu-content{
    display:flex;
    justify-content:space-between;
    padding:30px;
    gap:20px;
}

.column{
    flex:1;
}

.column h3{
    color:#7ce7ff;
    margin-bottom:20px;
    border-bottom:2px solid #7ce7ff;
    padding-bottom:10px;
    font-size:18px;
}

.item{
    display:flex;
    justify-content:space-between;
    margin:15px 0;
    padding-bottom:8px;
    border-bottom:1px dotted gray;
    font-size:14px;
}

.price{
    color:#7ce7ff;
    font-weight:bold;
}

@media(max-width:768px){
    .menu-content{
        flex-direction:column;
    }

    .title h1{
        font-size:40px;
    }

    .title h2{
        font-size:45px;
    }

    .menu-card{
        width:95%;
    }
}
</style>

</head>
<body>

<div class="menu-card">

    <div class="top-section">
        <div class="title">
            <h1>Coffee</h1>
            <h2>MENU</h2>
        </div>
    </div>

    <div class="menu-content">

        <div class="column">
            <h3>BREAKFAST</h3>

            <div class="item">
                <span>Pancakes</span>
                <span class="price">₹120</span>
            </div>

            <div class="item">
                <span>Sandwich</span>
                <span class="price">₹100</span>
            </div>

            <div class="item">
                <span>Croissant</span>
                <span class="price">₹90</span>
            </div>

            <div class="item">
                <span>Toast & Jam</span>
                <span class="price">₹80</span>
            </div>
        </div>

        <div class="column">
            <h3>COFFEE & ESPRESSO</h3>

            <div class="item">
                <span>Espresso</span>
                <span class="price">₹80</span>
            </div>

            <div class="item">
                <span>Cappuccino</span>
                <span class="price">₹150</span>
            </div>

            <div class="item">
                <span>Latte</span>
                <span class="price">₹140</span>
            </div>

            <div class="item">
                <span>Mocha</span>
                <span class="price">₹170</span>
            </div>
        </div>

        <div class="column">
            <h3>TEA SELECTION</h3>

            <div class="item">
                <span>Green Tea</span>
                <span class="price">₹70</span>
            </div>

            <div class="item">
                <span>Black Tea</span>
                <span class="price">₹60</span>
            </div>

            <div class="item">
                <span>Lemon Tea</span>
                <span class="price">₹80</span>
            </div>

            <div class="item">
                <span>Masala Tea</span>
                <span class="price">₹90</span>
            </div>
        </div>

    </div>

</div>

</body>
</html>
