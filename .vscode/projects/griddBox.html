<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosa Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
}

.container{
    width:600px;
    height:400px;
    border:3px solid black;
    padding:10px;

    display:grid;
    gap:10px;

    grid-template-columns:2fr 3fr;
    grid-template-rows:1fr 1fr 2fr;

    grid-template-areas:
        "dosa chatni"
        "dosa idli"
        "sambhar sambhar";
}

.box{
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    background:white;
}

.dosa{
    grid-area:dosa;
}

.chatni{
    grid-area:chatni;
}

.idli{
    grid-area:idli;
}

.sambhar{
    grid-area:sambhar;
}
</style>

</head>
<body>

<div class="container">
    <div class="box dosa">Bihar</div>
    <div class="box chatni">LittiChokha
    </div>
    <div class="box idli">Thekua</div>
    <div class="box sambhar">DahiChura</div>
</div>

</body>
</html>
