<!DOCTYPE html>
<html>
<head>
    <title>Position Demo</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            height: 1500px;
        }

        .container{
            position: relative;
            width: 500px;
            height: 300px;
            border: 3px solid black;
            margin: 100px auto;
        }

        .box{
            width: 100px;
            height: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
            font-weight: bold;
        }

        /* Static */
        .static{
            background: red;
            position: static;
        }

        /* Relative */
        .relative{
            background: green;
            position: relative;
            left: 50px;
            top: 20px;
        }

        /* Absolute */
        .absolute{
            background: blue;
            position: absolute;
            top: 0;
            right: 0;
        }

        /* Fixed */
        .fixed{
            background: purple;
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        /* Sticky */
        .sticky{
            background: orange;
            position: sticky;
            top: 0;
            width: 100%;
            height: 50px;
            line-height: 50px;
        }
    </style>
</head>
<body>

    <div class="sticky">STICKY</div>

    <div class="container">

        <div class="box static">Static</div>

        <div class="box relative">Relative</div>

        <div class="box absolute">Absolute</div>

    </div>

    <div class="box fixed">Fixed</div>

</body>
</html>
