<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Navbar</title>
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav class="navbar">

        <div class="left">
            <img src="https://in.bmscdn.com/webin/common/icons/logo.svg"
                alt="logo"
                class="logo">

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                type="text"
                placeholder="Search for Movies, Shows, Events and Activities">
            </div>
        </div>

        <div class="right">

            <span class="city">Vadodara</span>

            <button class="signin">
                Sign in
            </button>

            <i class="fa-solid fa-bars menu"></i>

        </div>

    </nav>

</body>
</html>
