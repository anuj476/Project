<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>

        body{
            background-color: rgb(11, 11, 11);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .card{
            width: 220px;
            background-color: rgb(241, 234, 234);
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }

        img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        h2{
            margin: 10px 0;
        }

        p{
            color: gray;
        }

        button{
            background-color: black;
            color: rgb(232, 226, 226);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
        }

    </style>

</head>
<body>

    <div class="card">

        <h2>Profile</h2>

        <img src="https://i.pravatar.cc/150?img=12">

        <h2>Mohit</h2>

        <p>MERN Dev</p>

        <button>Follow</button>

    </div>

</body>
</html>
