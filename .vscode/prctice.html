<!DOCTYPE html>
<html>
<head>
    <title>CSS Practice</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            background-color: lightblue;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 500px;
            padding: 20px;
            border: 3px solid black;
            background-color: white;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;

            position: relative;
        }

        .title{
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .box{
            width: 100px;
            height: 100px;
            background-color: orange;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge{
            position: absolute;
            top: -10px;
            right: -10px;

            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="badge">New</div>

        <h2 class="title">My CSS Practice</h2>

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>

    </div>

</body>
</html>
