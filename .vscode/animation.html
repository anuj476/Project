<!DOCTYPE html>
<html>
<head>
    <title>4 Box Animation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:black;
        }

        .container{
            width:300px;
            height:300px;
            border:3px solid white;
            position:relative;
        }

        .box{
            width:50px;
            height:50px;
            position:absolute;
        }

        .box1{
            background:red;
            animation:box1 4s infinite;
        }

        .box2{
            background:blue;
            animation:box2 4s infinite;
        }

        .box3{
            background:green;
            animation:box3 4s infinite;
        }

        .box4{
            background:yellow;
            animation:box4 4s infinite;
        }

        @keyframes box1{
            0%{
                top:0;
                left:0;
            }
            25%{
                top:0;
                left:250px;
            }
            50%{
                top:250px;
                left:250px;
            }
            75%{
                top:250px;
                left:0;
            }
            100%{
                top:0;
                left:0;
            }
        }

        @keyframes box2{
            0%{
                top:0;
                left:250px;
            }
            25%{
                top:250px;
                left:250px;
            }
            50%{
                top:250px;
                left:0;
            }
            75%{
                top:0;
                left:0;
            }
            100%{
                top:0;
                left:250px;
            }
        }

        @keyframes box3{
            0%{
                top:250px;
                left:250px;
            }
            25%{
                top:250px;
                left:0;
            }
            50%{
                top:0;
                left:0;
            }
            75%{
                top:0;
                left:250px;
            }
            100%{
                top:250px;
                left:250px;
            }
        }

        @keyframes box4{
            0%{
                top:250px;
                left:0;
            }
            25%{
                top:0;
                left:0;
            }
            50%{
                top:0;
                left:250px;
            }
            75%{
                top:250px;
                left:250px;
            }
            100%{
                top:250px;
                left:0;
            }
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
   

</body>
</html>
