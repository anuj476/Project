<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 2000px;
        }

        .box {
            width: 200px;
            height: 200px;
            display: inline-block;
            vertical-align: top;
            background-color: blue;
        }

        .relative {
            position: relative;
            background-color: lightblue;
        }

        .absolute {
            position: absolute;
            background-color: red;
            top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box relative"></div>
        <div class="box absolute"></div>
        <div class="box"></div>
    </div>
</body>

</html>
